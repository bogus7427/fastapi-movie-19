name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Secrets 미설정 시 건너뜀
        if: env.EC2_HOST == '' || env.EC2_SSH_KEY == ''
        run: echo "EC2_HOST / EC2_SSH_KEY secrets가 없어 배포를 건너뜁니다."

      - name: SSH로 배포 스크립트 실행
        if: env.EC2_HOST != '' && env.EC2_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new \
            "${EC2_USER:-ubuntu}@$EC2_HOST" \
            'bash ~/fastapi-movie-19/deploy/deploy.sh'
